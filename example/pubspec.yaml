name: audio_player_package_example
description: Example app for the audio_player_package
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  audio_player_package:
    path: ../   # Uses the package from the parent folder
  get_it: 9.2.1
  equatable: 2.0.8
  flutter_bloc: 9.1.1
  injectable: 3.0.0
  json_annotation: 4.12.0
  freezed: 3.2.5
  freezed_annotation: 3.1.0
  bloc_concurrency: 0.3.0
  get_storage: 2.1.1
  collection: 1.19.1
  flutter_svg: 2.3.0
  go_router: 17.2.3
  dio: 5.9.2
  path_provider: 2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  injectable_generator: 3.0.2
  build_runner: 2.15.0
  json_serializable: 6.14.0

flutter:
  uses-material-design: true
