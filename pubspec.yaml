name: audio_player_package
description: "A feature-rich, customizable audio player for Flutter with playlists, full media controls, background playback, notifications, and BLoC-powered UI widgets."
version: 1.0.0
repository: https://github.com/vishalbaps/audio_package
homepage: https://github.com/vishalbaps/audio_package
issue_tracker: https://github.com/vishalbaps/audio_package/issues

topics:
  - audio
  - audio-player
  - music
  - background-audio
  - media

environment:
  sdk: ^3.7.2

# Runtime dependencies. Use caret ranges so this package can co-exist with the
# other packages in a consumer's app — exact pins would make it nearly
# impossible to depend on alongside anything else.
dependencies:
  flutter:
    sdk: flutter

  just_audio: ^0.10.5
  audio_service: ^0.18.18
  audio_session: ^0.2.3
  rxdart: ^0.28.0
  flutter_bloc: ^9.1.1
  bloc_concurrency: ^0.3.0
  get_it: ^9.2.1
  injectable: ^3.0.0
  connectivity_plus: ^7.1.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  freezed: ^3.2.5
  injectable_generator: ^3.0.2
  json_serializable: ^6.14.0

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/icon/
    - assets/svg/
